<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas | RYC Tech</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo"><img src="imagenes/logo-ryctech.png" alt="RYC Tech" class="sidebar-logo-img"></div>
        <div class="sidebar-seccion">Catalogo</div>
        <ul>
            <li><a href="index.html"><i class="ti ti-home" aria-hidden="true"></i> Inicio</a></li>
            <li id="itemOfertas"><a href="ofertas.html" class="activo"><i class="ti ti-tag" aria-hidden="true"></i> Ofertas</a></li>
        </ul>
        <div class="sidebar-seccion">Informacion</div>
        <ul><li><a href="tienda.html"><i class="ti ti-building-store" aria-hidden="true"></i> La tienda</a></li></ul>
        <div id="seccionGestion" style="display:none;">
            <div class="sidebar-seccion">Gestion</div>
            <ul><li><a href="admin.html"><i class="ti ti-settings" aria-hidden="true"></i> Panel admin</a></li></ul>
        </div>
    </div>
    <div class="contenido">
        <div class="topbar">
            <div class="topbar-busqueda"><i class="ti ti-search" aria-hidden="true"></i><input type="search" id="inputBuscar" autocomplete="off" placeholder="Buscar ofertas..."></div>
            <button class="btn-login" id="btnLogin" onclick="abrirModal('modalLogin')"><i class="ti ti-lock" aria-hidden="true"></i> Iniciar sesion</button>
        </div>
        <div class="hero" style="padding:28px 36px;margin-bottom:24px;background:linear-gradient(110deg,#1a0a0a,#7f1d1d,#1a0a2e);">
            <div class="hero-etiqueta" style="background:rgba(220,38,38,.2);border-color:rgba(220,38,38,.4);color:#fca5a5;">Ofertas especiales</div>
            <h1>Precios <span style="color:#f87171;">que sorprenden</span></h1>
            <p>Descuentos exclusivos por tiempo limitado en los mejores productos.</p>
        </div>
        <div class="productos-grid" id="productosGrid" data-filtro="Ofertas"></div>
        <div class="paginacion" id="paginacionContenedor"></div>
    </div>
    <div class="modal-fondo" id="modalProducto"><div class="modal-caja"><div class="modal-encabezado"><span id="modalProdCategoria" style="font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;color:#2563EB;"></span><button class="btn-cerrar-modal" onclick="cerrarModal('modalProducto')"><i class="ti ti-x" aria-hidden="true"></i></button></div><div class="modal-cuerpo"><img class="modal-producto-imagen" id="modalProdImg" src="" alt=""><div class="modal-producto-nombre" id="modalProdNombre"></div><div class="modal-producto-precio" id="modalProdPrecio"></div><p class="modal-producto-descripcion" id="modalProdDescripcion"></p><div class="specs-titulo">Especificaciones tecnicas</div><div class="specs-grid" id="modalProdSpecs"></div></div></div></div>
    <div class="modal-fondo" id="modalLogin"><div class="modal-caja"><div class="login-encabezado"><div class="login-encabezado-icono"><i class="ti ti-lock" aria-hidden="true"></i></div><h2>Acceso empleados</h2><p>Solo personal autorizado de RYC Tech</p></div><div class="login-cuerpo"><div class="form-grupo"><label for="loginCorreo">Correo electronico</label><input type="email" id="loginCorreo" placeholder="correo@ryctech.com"></div><div class="form-grupo"><label for="loginPassword">Contrasena</label><input type="password" id="loginPassword" placeholder="Contrasena"></div><div class="form-acciones" style="justify-content:space-between;align-items:center;"><button class="btn-secundario" onclick="cerrarModal('modalLogin')">Cancelar</button><button class="btn-primario" onclick="iniciarSesion()">Iniciar sesion</button></div></div></div></div>
    <script src="js/utils.js"></script><script src="js/login.js"></script><script src="js/productos.js"></script>
</body>
</html>
